name: portfolio18
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/portfolio
      DB_USER: portfolio
      DB_PASSWORD: ${DB_PASSWORD:-portfolio}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8188:8080"
  web:
    build: ./frontend
    depends_on: [api]
    ports:
      - "127.0.0.1:5178:80"
volumes:
  pgdata:
